<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TALMUD AI - Admin Dictionnaire</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:#f6f7fb; color:#172033; }
    header { background:#101827; color:white; padding:18px 20px; }
    header h1 { margin:0; font-size:22px; }
    header p { margin:4px 0 0; opacity:.8; }
    main { max-width:900px; margin:24px auto; padding:0 16px; }
    .card { background:white; border:1px solid #d9deea; border-radius:18px; box-shadow:0 8px 30px rgba(18,31,56,.08); padding:20px; margin-bottom:18px; }
    label { display:block; font-weight:700; margin:14px 0 6px; }
    input, textarea, select { width:100%; border:1px solid #d9deea; border-radius:12px; padding:12px; font-size:16px; background:white; color:#172033; }
    textarea { min-height:90px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    button { border:none; border-radius:12px; padding:13px 18px; font-weight:800; font-size:16px; cursor:pointer; margin-top:18px; }
    .primary { background:#1f5eff; color:white; }
    .secondary { background:#e9edf8; color:#172033; margin-left:8px; }
    .status { margin-top:16px; padding:12px; border-radius:12px; background:#eef2ff; white-space:pre-wrap; }
    .ok { color:#0f7b3f; }
    .error { color:#b3261e; }
    .preview { direction:rtl; font-size:22px; font-weight:700; padding:12px; background:#f7f7f7; border-radius:12px; margin-top:8px; }
    small { color:#657084; }
    @media (max-width:700px) { .row { grid-template-columns:1fr; } main { margin:14px auto; } .card { padding:16px; border-radius:14px; } }
  </style>
</head>
<body>
  <header>
    <h1>📖 TALMUD AI - Admin dictionnaire</h1>
    <p>Ajouter un mot et le pousser automatiquement vers GitHub.</p>
  </header>

  <main>
    <section class="card">
      <h2>Connexion admin</h2>
      <label for="password">Mot de passe admin</label>
      <input id="password" type="password" placeholder="Mot de passe Vercel : ADMIN_PASSWORD" />
      <small>Ce mot de passe autorise l'ajout.</small>
    </section>

    <section class="card">
      <h2>Ajouter / modifier une entrée</h2>

      <label for="category">Catégorie</label>
      <select id="category">
        <option value="aramic">Araméen</option>
        <option value="talmud">Talmud</option>
        <option value="hebrew">Hébreu</option>
        <option value="english">English</option>
      </select>

      <label for="term">Mot / entrée</label>
      <input id="term" placeholder="Exemple : אטו" dir="auto" />
      <div id="preview" class="preview">אטו</div>

      <div class="row">
        <div>
          <label for="fr">Traduction française</label>
          <textarea id="fr" placeholder="Exemple : Est-ce vraiment ? à cause de, penses-tu ?"></textarea>
        </div>
        <div>
          <label for="en">English translation</label>
          <textarea id="en" placeholder="Example: Really? because of, do you think?"></textarea>
        </div>
      </div>

      <label for="note">Note optionnelle</label>
      <input id="note" placeholder="Source, remarque, correction..." />

      <button class="primary" id="saveBtn">Ajouter au dictionnaire</button>
      <button class="secondary" id="clearBtn">Effacer</button>

      <div id="status" class="status">Prêt.</div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id)

    $('term').addEventListener('input', () => {
      $('preview').textContent = $('term').value.trim() || 'אטו'
    })

    $('clearBtn').addEventListener('click', () => {
      $('term').value = ''
      $('fr').value = ''
      $('en').value = ''
      $('note').value = ''
      $('preview').textContent = 'אטו'
      setStatus('Formulaire vidé.')
    })

    $('saveBtn').addEventListener('click', async () => {
      const payload = {
        password: $('password').value,
        category: $('category').value.trim() || 'aramic',
        term: $('term').value.trim(),
        fr: $('fr').value.trim(),
        en: $('en').value.trim(),
        note: $('note').value.trim()
      }

      if (!payload.password) return setStatus('Mot de passe admin manquant.', true)
      if (!payload.term) return setStatus('Mot / entrée manquant.', true)
      if (!payload.fr && !payload.en) return setStatus('Il faut au moins une traduction française ou anglaise.', true)

      setStatus('Envoi vers GitHub en cours...')

      try {
        const res = await fetch('/api/dictionary-add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })

        const data = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(data.error || `Erreur HTTP ${res.status}`)

        setStatus(`✅ Mot ajouté/modifié.\nFichier : ${data.path}\nCommit : ${data.commit || 'créé'}\nEntrées catégorie : ${data.categoryCount}`, false, true)
      } catch (e) {
        setStatus('❌ Erreur : ' + e.message, true)
      }
    })

    function setStatus(text, isError = false, isOk = false) {
      const box = $('status')
      box.textContent = text
      box.className = 'status' + (isError ? ' error' : '') + (isOk ? ' ok' : '')
    }
  </script>
</body>
</html>
